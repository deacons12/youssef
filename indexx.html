<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبر نفسك - Operating Systems</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--blue:#2563eb;--green:#15803d;--red:#dc2626;--line:#e2e8f0}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif;line-height:1.65}
header{background:linear-gradient(130deg,#142d5c,#2563eb);color:#fff;padding:26px 16px 22px;text-align:center}
header h1{margin:0 0 5px;font-size:clamp(22px,5vw,32px)} header p{margin:0;color:#dbeafe}
.wrap{max-width:900px;margin:20px auto;padding:0 13px 40px}
.topbar{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 4px 14px #0f172a0a}
select,button{font:inherit;border-radius:10px;padding:10px 13px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button{cursor:pointer;font-weight:bold}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.secondary{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.progress{height:8px;background:#e8eef8;border-radius:20px;overflow:hidden;margin-top:9px;flex-basis:100%}.bar{height:100%;width:0;background:#22c55e;transition:width .2s}
.section{margin:22px 0 10px;font-size:20px;color:#1e3a8a}
.q{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin:11px 0;box-shadow:0 3px 12px #0f172a08}
.qhead{display:flex;gap:9px;align-items:flex-start}.num{background:#eaf1ff;color:#1d4ed8;border-radius:8px;min-width:31px;height:31px;display:grid;place-items:center;font-weight:bold}
.question{font-weight:700;direction:ltr;text-align:left;flex:1}
.answer{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;direction:ltr;text-align:left}
.options{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;direction:ltr;text-align:left}
.opt:has(input:checked){background:#eff6ff;border-color:#60a5fa}.opt input{margin-top:5px;accent-color:var(--blue)}
.feedback{display:none;margin-top:11px;padding:10px 12px;border-radius:10px;font-weight:bold}
.feedback.correct{display:block;background:#dcfce7;color:#166534}.feedback.wrong{display:block;background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.result{display:none;background:#fff;border:2px solid #93c5fd;border-radius:16px;padding:20px;text-align:center;margin:20px 0}
.result strong{font-size:32px;color:#1d4ed8}.hint{color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px}
@media(min-width:650px){.answer input{max-width:460px}.options{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>اختبر نفسك – Operating Systems</h1><p>Chapter 1 + Chapter 3 | جاوب وبعدين اضغط Submit للتصحيح</p></header>
<main class="wrap">
<div class="topbar">
 <label>عرض الأسئلة:
  <select id="filter" onchange="filterQuestions()">
   <option value="all">كل الأسئلة</option><option value="ch1">Chapter 1 – Fill in the blanks</option>
   <option value="ch3fill">Chapter 3 – Fill in the blanks</option><option value="mcq">Chapter 3 – MCQ</option>
  </select>
 </label>
 <span id="count">عدد الأسئلة: 47</span>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <span class="hint" id="progressText">تمت الإجابة عن 0 سؤال</span>
</div>
<div id="quiz"></div>
<div class="result" id="result"><div>نتيجتك</div><strong id="score">0 / 0</strong><p id="percent"></p><p id="summary"></p></div>
<div class="actions">
 <button class="primary" onclick="submitQuiz()">Submit – صحح إجاباتي</button>
 <button class="secondary" onclick="resetQuiz()">إعادة الاختبار</button>
</div>
<footer>التصحيح يظهر بعد الضغط على Submit. اكتب إجابات الـ Fill in the blanks بالإنجليزي.</footer>
</main>
<script>
const fill1 = [
["The invention of the ______ was the hardware revolution that brought about desktop and handheld computing.","microprocessor"],
["The classic microprocessor is giving way to the ______, where CPUs, caches and other components are on the same chip.","system on a chip (soc)","system on a chip","soc"],
["The processing required for a single instruction is called an ______ cycle.","instruction"],
["The fetched instruction is loaded into the ______.","instruction register (ir)","instruction register","ir"],
["The I/O module sends an ______ signal to the processor when the device is ready.","interrupt"],
["The device that stages movement of data between main memory and processor registers is ______.","cache memory"],
["External, nonvolatile memory is also called ______ or auxiliary memory.","secondary memory"],
["The ______ determines which cache location a new block will occupy.","mapping function"],
["In a ______ multiprocessor, all processors can perform the same functions.","symmetric multiprocessing (smp)","symmetric multiprocessing","smp"],
["A computer combining two or more processors on one piece of silicon is a ______ computer.","multicore"],
["The register containing the address of the next instruction to be fetched is the ______.","program counter (pc)","program counter","pc"],
["Each main-memory location contains a ______ value interpreted as instruction or data.","binary"],
["The address register required for user-visible stack addressing is the ______.","stack pointer (sp)","stack pointer","sp"],
["Registers used by system programs to minimize main-memory references are ______ registers.","general-purpose","general purpose"],
["Multiple programs taking turns in execution is called ______.","multiprogramming"]
];
const fill3 = [
["A process is in the ______ state when it is in secondary memory and awaiting an event.","blocked/suspend","blocked suspend","blocked/suspended"],
["Two essential elements of a process are ______ and a set of data associated with that code.","program code"],
["The ______ tables provide information about the existence and location of files and their attributes.","file"],
["The ______ contains sufficient information to interrupt a running process and later resume it.","process control block (pcb)","process control block","pcb"],
["Creating a process at the explicit request of another process is called ______.","process spawning","spawning"],
["Giving each process in the queue a certain amount of time in turn is ______ scheduling.","round-robin","round robin"],
["A process in main memory and available for execution is in the ______ state.","ready"],
["______ tables track both main (real) and secondary (virtual) memory.","memory"],
["PCB information categories include process identification, ______, and process control information.","processor state information"],
["The maximum time a process can execute before being interrupted is a ______.","time slice"],
["The principal function of the OS is to create, manage, and ______ processes.","schedule"],
["The principal function of the OS is to create, manage, and ______ processes.","control"],
["The portion of the OS that selects the next process to run is the ______.","dispatcher"],
["The collection of program, data, stack, and attributes is the ______.","process image"],
["A process in main memory and awaiting an event is in the ______ state.","blocked"],
["The sequence of instructions that executes for an individual process is called a ______.","trace"],
["An error or exception condition generated within the currently running process is a ______.","trap"]
];
const mcqs = [
["Which is NOT an essential element of a process?",["Program code","CPU registers","Stack","Hard disk"],3],
["In a five-state model, a process in Blocked state is:",["Ready for execution","Waiting for an event to occur","Being executed","Terminated"],1],
["What is the main role of the PCB?",["Stores process attributes and manages execution","Controls file system operations","Schedules the CPU for different processes","Handles memory management only"],0],
["A process in the Suspended state:",["Cannot be resumed","Is waiting in the ready queue","Has been moved to secondary storage","Is executing in kernel mode"],2],
["Which is NOT a reason for process termination?",["Normal completion","Timeout","Process enters an infinite loop","Memory limit exceeded"],2],
["A process suspended by an agent to prevent execution is a ______ process.",["Blocked","Suspended","Ready","Swapped"],1],
["The principal responsibility to control process execution belongs to the:",["OS","Process control block","Memory","Dispatcher"],0],
["When one process spawns another, the spawned process is the:",["Trap process","Child process","Stack process","Parent process"],1],
["A process in main memory and awaiting an event is in the:",["Blocked","Blocked/Suspend","Ready/Suspend","Ready"],0],
["The portion of the OS that selects the next process to run is the:",["Trace","Process control block","Dispatcher","PSW"],2],
["When a computer system boots and starts a user application after an interrupt occurs, which operating modes are involved?",["User mode → System mode","System mode → User mode","User mode only","System mode only"],1],
["The sequence of instructions that executes for an individual process is called:",["Process image","Trace","Dispatcher","Program counter"],1],
["When one process spawns another, the spawned process is called:",["Parent process","Trap process","Child process","Stack process"],2],
["Which system gives higher CPU utilization when jobs require both I/O and CPU time?",["Single-programming system","Multiprogramming system","Batch-only system","Time-sharing disabled"],1],
["Managing system resources among multiple students to ensure fairness is which principle?",["Process scheduling","Memory management","Interrupt handling","Resource allocation"],3]
];
const sections = [
 {id:"ch1",title:"Chapter 1 – Fill in the blanks",type:"fill",items:fill1},
 {id:"ch3fill",title:"Chapter 3 – Fill in the blanks",type:"fill",items:fill3},
 {id:"mcq",title:"Chapter 3 – Choose the correct answer (MCQ)",type:"mcq",items:mcqs}
];
const quiz=document.getElementById("quiz");
function norm(s){return (s||"").toLowerCase().trim().replace(/[().,]/g,"").replace(/\s+/g," ")}
function render(){
 quiz.innerHTML="";let n=0;const f=document.getElementById("filter").value;
 sections.filter(s=>f==="all"||s.id===f).forEach(sec=>{
  const h=document.createElement("h2");h.className="section";h.textContent=sec.title;quiz.appendChild(h);
  sec.items.forEach((item,i)=>{n++;const card=document.createElement("section");card.className="q";card.dataset.section=sec.id;card.dataset.index=i;
   const head=document.createElement("div");head.className="qhead";head.innerHTML=`<span class="num">${i+1}</span><div class="question">${item[0]}</div>`;card.appendChild(head);
   if(sec.type==="fill"){
    const box=document.createElement("div");box.className="answer";box.innerHTML=`<input type="text" autocomplete="off" placeholder="اكتب إجابتك هنا..." aria-label="إجابتك">`;card.appendChild(box);
   }else{
    const opts=document.createElement("div");opts.className="options";
    item[1].forEach((op,j)=>{const lab=document.createElement("label");lab.className="opt";lab.innerHTML=`<input type="radio" name="${sec.id}_${i}" value="${j}"><span>${String.fromCharCode(65+j)}) ${op}</span>`;opts.appendChild(lab)});card.appendChild(opts);
   }
   const fb=document.createElement("div");fb.className="feedback";card.appendChild(fb);quiz.appendChild(card);
  });
 });
 document.getElementById("count").textContent="عدد الأسئلة: "+n;document.getElementById("result").style.display="none";updateProgress();
}
function filterQuestions(){render()}
function updateProgress(){
 const cards=[...document.querySelectorAll(".q")];let done=0;
 cards.forEach(c=>{if(c.querySelector("input[type=text]")?.value.trim()||c.querySelector("input[type=radio]:checked"))done++});
 document.getElementById("progressText").textContent=`تمت الإجابة عن ${done} من ${cards.length} سؤال`;
 document.getElementById("bar").style.width=(cards.length?done/cards.length*100:0)+"%";
}
document.addEventListener("input",e=>{if(e.target.matches(".q input"))updateProgress()});
document.addEventListener("change",e=>{if(e.target.matches(".q input"))updateProgress()});
function submitQuiz(){
 const cards=[...document.querySelectorAll(".q")];let correct=0,answered=0;
 cards.forEach(c=>{
  const sec=sections.find(s=>s.id===c.dataset.section),i=+c.dataset.index,item=sec.items[i],fb=c.querySelector(".feedback");let ok=false,answer="";
  if(sec.type==="fill"){
   const val=c.querySelector("input").value; if(val.trim())answered++;
   ok=(item.slice(1).some(a=>norm(a)===norm(val)));
   answer=item[1];
  }else{
   const chosen=c.querySelector("input:checked");if(chosen)answered++;
   ok=!!chosen&&+chosen.value===item[2];answer=String.fromCharCode(65+item[2])+") "+item[1][item[2]];
  }
  if(ok)correct++;
  fb.className="feedback "+(ok?"correct":"wrong");
  fb.textContent=(ok?"✓ إجابة صحيحة":"✗ إجابة غير صحيحة")+" — الإجابة الصحيحة: "+answer;
 });
 const pct=cards.length?Math.round(correct/cards.length*100):0;
 document.getElementById("score").textContent=`${correct} / ${cards.length}`;
 document.getElementById("percent").textContent=`النسبة: ${pct}%`;
 document.getElementById("summary").textContent=`أجبت عن ${answered} سؤال من ${cards.length}. ${pct>=85?"ممتاز!":pct>=60?"كويس، راجع الأسئلة اللي غلطت فيها.":"راجع الإجابات وحاول مرة تانية."}`;
 document.getElementById("result").style.display="block";
 document.getElementById("result").scrollIntoView({behavior:"smooth",block:"center"});
}
function resetQuiz(){render();window.scrollTo({top:0,behavior:"smooth"})}
render();
</script>
</body></html>
